<!--
FSR (Funkcionális Specifikáció):
- Mire használjuk: Külső BENU CDN kép betöltésének tesztelése és összehasonlítása verziózott URL használatával.
- User Storyk: Fejlesztőként szeretném látni, hogyan viselkedik a CDN és a böngésző gyorstárazása, ha query paramétert (?v=...) használunk a kép URL-ben.
- Kapcsolódó funkciók: Gyógyszer adatlap, termékképek megjelenítése a rendszerben.
-->
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kép Teszt - Verziózott URL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-secondary: #818cf8;
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, hsla(210, 100%, 15%, 1) 0, transparent 50%), 
                radial-gradient(at 100% 100%, hsla(230, 100%, 10%, 1) 0, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: var(--text-primary);
        }

        .container {
            max-width: 650px;
            width: 100%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .image-container {
            position: relative;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 2rem;
            border: 1px solid var(--glass-border);
            transition: transform 0.3s ease;
        }

        .image-container:hover {
            transform: scale(1.02);
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .info-grid {
            display: grid;
            gap: 1rem;
            text-align: left;
            margin-top: 1.5rem;
        }

        .info-item {
            background: rgba(15, 23, 42, 0.4);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-primary);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .value {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            word-break: break-all;
            color: var(--text-primary);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent-primary);
            border: 1px solid rgba(56, 189, 248, 0.3);
            margin-bottom: 1rem;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="status-badge">Teszt Oldal #1</div>
            <div class="header">
                <h1>Verziózott Kép Betöltése</h1>
                <p class="subtitle">Külső CDN asset ellenőrzése verzió paraméterrel</p>
            </div>

            <div class="image-container">
                <img src="https://benu.hu/cdn/shop/files/cda372d5-ffab-46d6-8641-d3e64cc52d7a_600x600.jpg?v=1775569950" alt="BENU Product">
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <span class="label">Kép URL</span>
                    <span class="value">https://benu.hu/cdn/shop/files/cda372d5-ffab-46d6-8641-d3e64cc52d7a_600x600.jpg?v=1775569950</span>
                </div>
                <div class="info-item">
                    <span class="label">Oldal Betöltve</span>
                    <span class="value" id="load-time"></span>
                </div>
            </div>

            <div class="footer">
                &copy; 2026 Orvosi Portál Rendszer - Kép CDN Teszt
            </div>
        </div>
    </div>

    <script>
        document.getElementById('load-time').innerText = new Date().toLocaleString('hu-HU');
    </script>
</body>
</html>
